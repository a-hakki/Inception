services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    image: mariadb
    restart: always
    networks:
      - inception_net
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mariadb

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress
    restart: always
    networks:
      - inception_net
    volumes:
      - wp_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - mariadb

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    image: nginx:latest
    restart: always
    ports:
      - "443:443"
    networks:
      - inception_net
    volumes:
      - wp_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - wordpress

networks:
  inception_net:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/home/ahakki/data/mariadb"

  wp_data:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/home/ahakki/data/wordpress"